apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-ingress
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cert-manager
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-csr-vault
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-vault-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-apps
    ports:
    - protocol: TCP
      port: 8200
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vault
    ports:
    - protocol: TCP
      port: 8201
