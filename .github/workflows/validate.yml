name: Validar manifests e procedimentos
'on':
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements-test.txt
    - run: python tests/validate.py
    - run: python -m compileall -q scripts tests
    - name: "Verificar gera\xE7\xE3o reproduz\xEDvel"
      run: bash scripts/render.sh --check
